name: Build Boston Overlay Fix

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # ✅ THIS FIXES THE 403 ERROR: Grants permission to create releases
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install build-tools and platform
        run: |
          set -e
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "build-tools;35.0.0" "platforms;android-35"

      - name: Locate SDK tools
        id: sdk
        run: |
          set -e
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          PLATFORM_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          if [ ! -d "$BUILD_TOOLS" ]; then
            echo "ERROR: build-tools not found at $BUILD_TOOLS"
            exit 1
          fi
          if [ ! -f "$PLATFORM_JAR" ]; then
            echo "ERROR: android.jar not found at $PLATFORM_JAR"
            exit 1
          fi
          echo "build_tools=$BUILD_TOOLS" >> "$GITHUB_OUTPUT"
          echo "platform_jar=$PLATFORM_JAR" >> "$GITHUB_OUTPUT"

      - name: Generate signing keystore
        run: |
          set -e
          if [ -d "boston_module" ]; then cd boston_module; fi
          keytool -genkeypair -v \
            -keystore boston_overlay_debug.keystore \
            -alias boston-overlay \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass boston-overlay-debug \
            -keypass boston-overlay-debug \
            -dname "CN=Boston Overlay Fix, OU=Personal, O=Personal, L=Unknown, ST=Unknown, C=US"

      - name: Compile, link, align, and sign each overlay
        run: |
          if [ -d "boston_module" ]; then cd boston_module; fi
          AAPT2="${{ steps.sdk.outputs.build_tools }}/aapt2"
          ZIPALIGN="${{ steps.sdk.outputs.build_tools }}/zipalign"
          APKSIGNER="${{ steps.sdk.outputs.build_tools }}/apksigner"
          FRAMEWORK="${{ steps.sdk.outputs.platform_jar }}"
          mkdir -p build_output dist compiled_resources
          FAILED=0
          for overlay_dir in overlays/*/; do
            name=$(basename "$overlay_dir")
            manifest="$overlay_dir/AndroidManifest.xml"
            res_dir="$overlay_dir/res"
            compiled_zip="compiled_resources/${name}.zip"
            echo "=== Building $name ==="
            if [ -d "$res_dir" ]; then
              "$AAPT2" compile --dir "$res_dir" -o "$compiled_zip" || { echo "compile FAILED"; FAILED=1; continue; }
            fi
            if [ ! -f "$compiled_zip" ]; then
              echo "SKIP $name: no compiled resources"
              continue
            fi
            "$AAPT2" link -I "$FRAMEWORK" --manifest "$manifest" -o "build_output/${name}.unsigned.apk" "$compiled_zip" || { echo "link FAILED"; FAILED=1; continue; }
            "$ZIPALIGN" -f 4 "build_output/${name}.unsigned.apk" "build_output/${name}.aligned.apk" || { echo "zipalign FAILED"; FAILED=1; continue; }
            "$APKSIGNER" sign \
              --ks boston_overlay_debug.keystore \
              --ks-pass pass:boston-overlay-debug \
              --ks-key-alias boston-overlay \
              --out "dist/${name}.apk" \
              "build_output/${name}.aligned.apk" || { echo "sign FAILED"; FAILED=1; continue; }
            echo "OK: dist/${name}.apk"
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "One or more overlays failed."
            exit 1
          fi

      - name: Assemble flashable Magisk zip
        run: |
          set -e
          if [ -d "boston_module" ]; then cd boston_module; fi
          STAGING=module_staging
          rm -rf "$STAGING"
          mkdir -p "$STAGING/META-INF/com/google/android"
          mkdir -p "$STAGING/overlay/product/overlay"
          mkdir -p "$STAGING/system/product/overlay"
          mkdir -p "$STAGING/system/product/etc"
          mkdir -p "$STAGING/system/system/etc"
          mkdir -p "$STAGING/system/vendor/etc"
          cp module.prop "$STAGING/"
          [ -f system.prop ] && cp system.prop "$STAGING/"
          cp META-INF/com/google/android/update-binary "$STAGING/META-INF/com/google/android/"
          cp META-INF/com/google/android/updater-script "$STAGING/META-INF/com/google/android/"
          cp common/customize.sh "$STAGING/"
          cp common/post-fs-data.sh "$STAGING/"
          cp common/service.sh "$STAGING/"
          cp dist/*.apk "$STAGING/overlay/product/overlay/"
          cp dist/*.apk "$STAGING/system/product/overlay/"
          [ -d overlay/product/etc ] && cp -a overlay/product/etc/* "$STAGING/system/product/etc/" 2>/dev/null || true
          [ -d overlay/system/etc ] && cp -a overlay/system/etc/* "$STAGING/system/system/etc/" 2>/dev/null || true
          [ -d overlay/vendor/etc ] && cp -a overlay/vendor/etc/* "$STAGING/system/vendor/etc/" 2>/dev/null || true
          cd "$STAGING"
          zip -r -X ../boston_gsi_overlay_fix_v5.zip . -x ".*"

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: boston_gsi_overlay_fix_v5
          path: "**/boston_gsi_overlay_fix_v5.zip"
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5
          name: Boston Overlay Fix v5
          files: boston_gsi_overlay_fix_v5.zip
          generate_release_notes: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
